name: Build (Darth fork)

# Fork-only build: builds a static innoextract binary from source and publishes it to a
# rolling "darth-latest" GitHub Release on every push to this fork's main, plus a
# permanent "v<VERSION>" release (e.g. v1.13-darth) whenever the built binary's
# --version (sourced from the VERSION file) hasn't been released yet. Guarded by the
# repository check below so that if this file is ever pulled into doZennn's or
# dscharrer's upstream repo (e.g. by accident via a future PR), it stays inert there
# instead of running.
#
# This is the only workflow in the fork (the ones inherited from upstream were removed),
# so nothing else runs on the "v*" tags created here.
on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  BOOST_VERSION: 1.90.0

permissions:
  contents: write

jobs:
  build:
    if: github.repository == 'DarthSidiousPT/innoextract'
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v3

      - name: Setup workflow vars
        run: |
          echo "BOOST_VER_UNDERSCORES=$(echo $BOOST_VERSION | sed 's/\./_/g')" >> "$GITHUB_ENV"

      - name: Create build dirs
        run: mkdir -p build

      - name: Build zlib
        run: |
          cd build
          wget -q https://www.zlib.net/current/zlib.tar.gz
          tar xzf zlib.tar.gz
          rm zlib.tar.gz
          cd zlib-*
          ./configure --static
          make -j"$(nproc)"

      - name: Build bzip2
        run: |
          cd build
          wget -q https://sourceware.org/pub/bzip2/bzip2-latest.tar.gz
          tar xzf bzip2-latest.tar.gz
          rm bzip2-latest.tar.gz
          cd bzip2-*
          make bzip2

      - name: Build boost
        run: |
          cd build
          wget -q "https://archives.boost.io/release/$BOOST_VERSION/source/boost_$BOOST_VER_UNDERSCORES.tar.gz"
          tar xzf "boost_$BOOST_VER_UNDERSCORES.tar.gz"
          rm boost_$BOOST_VER_UNDERSCORES.tar.gz
          cd "boost_$BOOST_VER_UNDERSCORES"
          ./bootstrap.sh
          ZLIB_BINARY=../zlib-*/libz
          ZLIB_SOURCE=../zlib-*/
          BZIP2_SOURCE=../bzip2-*/
          ./b2 link=static variant=release --with-iostreams --with-filesystem --with-date_time --with-system --with-program_options

      - name: Configure CMake
        # This runner's CMake no longer ships the legacy FindBoost.cmake module at all
        # (removed in CMake 4.0 - Boost has shipped its own native CMake config packages
        # since ~1.70, making the module redundant). So find_package(Boost ...) here
        # only ever does Config-mode lookup; BOOST_ROOT/Boost_INCLUDE_DIR/
        # Boost_NO_SYSTEM_PATHS are all Module-mode-only variables and do nothing.
        # The Boost we just built from source above does generate its own config
        # package (stage/lib/cmake/Boost-<version>/), so point CMAKE_PREFIX_PATH at
        # that instead - confirmed locally to correctly resolve Boost_DIR to our
        # source-built Boost rather than any system-installed one.
        run: cmake -DCMAKE_FIND_PACKAGE_PREFER_CONFIG=ON -B "${{ github.workspace }}/build" -DCMAKE_BUILD_TYPE="${{ env.BUILD_TYPE }}" -DUSE_STATIC_LIBS=ON -DCMAKE_PREFIX_PATH="build/boost_$BOOST_VER_UNDERSCORES/stage"

      - name: Build
        run: |
          cd build
          make -j"$(nproc)"
          strip innoextract
          cp innoextract innoextract-upx

      - name: Pack a version with UPX
        uses: crazy-max/ghaction-upx@v3
        with:
          files: build/innoextract-upx

      - name: Pack files
        run: |
          cd build
          chmod +x innoextract
          chmod +x innoextract-upx
          tar -cvzf innoextract.tar.gz innoextract
          tar -cvzf innoextract-upx.tar.gz innoextract-upx

      - uses: actions/upload-artifact@v4
        with:
          name: innoextract-darth
          path: build/innoextract*.tar.gz

      - name: Compute short commit SHA
        id: vars
        run: echo "sha_short=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Read version from the built binary
        id: ver
        run: |
          version=$(build/innoextract --version | head -n1 | sed 's/\x1b\[[0-9;]*m//g' | awk '{print $2}')
          if [ -z "$version" ]; then
            echo "Could not parse a version out of 'innoextract --version'." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check whether that version was already released
        id: check
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.ver.outputs.tag }}" > /dev/null; then
            echo "is_new=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Move rolling darth-latest tag to this commit
        run: |
          git tag -f darth-latest
          git push -f origin darth-latest

      - name: Publish rolling latest release
        uses: ncipollo/release-action@v1
        with:
          tag: darth-latest
          artifacts: "build/innoextract.tar.gz,build/innoextract-upx.tar.gz"
          name: "Darth fork build (latest main)"
          body: "Automated build of innoextract ${{ steps.ver.outputs.version }} from ${{ github.repository }}@${{ github.sha }}. Unofficial, not from doZennn or upstream innoextract."
          allowUpdates: true
          makeLatest: false

      # Only published when VERSION was bumped, so a plain push to main that didn't
      # change VERSION just updates darth-latest above instead of minting a new tag.
      - name: Publish versioned release
        if: steps.check.outputs.is_new == 'true'
        uses: ncipollo/release-action@v1
        with:
          tag: "${{ steps.ver.outputs.tag }}"
          artifacts: "build/innoextract.tar.gz,build/innoextract-upx.tar.gz"
          name: "innoextract ${{ steps.ver.outputs.version }}"
          body: "Automated build of innoextract ${{ steps.ver.outputs.version }} from ${{ github.repository }}@${{ github.sha }}. Unofficial, not from doZennn or upstream innoextract."
          allowUpdates: false
          makeLatest: false
